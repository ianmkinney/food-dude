<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>AmpliFood</title>
    <meta name="description" content="AmpliFood is a kitchen companion with a little attitude: recipes, meal plans, pantry, grocery lists and an AI chef. Your data stays in your browser." />
    <meta name="application-name" content="AmpliFood" />
    <meta name="apple-mobile-web-app-title" content="AmpliFood" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FBF4E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1216" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="AmpliFood" />
    <meta property="og:description" content="A kitchen companion with a little attitude." />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #FBF4E8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1A1216;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      AmpliFood needs JavaScript to run.
    </noscript>
    <div id="root"></div>
  </body>
</html>
